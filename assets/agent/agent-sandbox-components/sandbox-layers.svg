<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img"><title>Sandbox control plane and execution plane</title><style>text{font-family:Arial,sans-serif;fill:#244c40}.title{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#65786e}.box{fill:#fff;stroke:#93b29a;stroke-width:1.5}.edge{stroke:#487761;stroke-width:2;fill:none}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#487761"/></marker></defs><rect width="900" height="760" fill="#f4f8ef" rx="14"/><text class="title" x="28" y="42">Sandbox control plane and execution plane</text><rect class="box" x="28" y="80" width="395" height="92" rx="10"/><text class="label" x="44" y="108">Application / Harbor</text><text class="body" x="44" y="134">Task, trial, session, artifacts</text><rect class="box" x="477" y="80" width="395" height="92" rx="10"/><text class="label" x="493" y="108">E2B SDK client</text><text class="body" x="493" y="134">Create / connect / commands</text><text class="body" x="493" y="156">Backend selected by config</text><path class="edge" marker-end="url(#arrow)" d="M425,120 L472,120"/><rect class="box" x="477" y="208" width="395" height="92" rx="10"/><text class="label" x="493" y="236">Gateway and manager</text><text class="body" x="493" y="262">Domain, TLS, authentication</text><text class="body" x="493" y="284">Allocate and route instances</text><path class="edge" marker-end="url(#arrow)" d="M675,175 L675,203"/><rect class="box" x="28" y="208" width="395" height="92" rx="10"/><text class="label" x="44" y="236">Controller + warm pool</text><text class="body" x="44" y="262">SandboxSet / Claim / Sandbox</text><text class="body" x="44" y="284">Reconcile desired state</text><path class="edge" marker-end="url(#arrow)" d="M474,254 L428,254"/><rect class="box" x="28" y="338" width="844" height="92" rx="10"/><text class="label" x="44" y="366">Runtime instances</text><text class="body" x="44" y="392">Isolation, files, envd / processes; resources and lifecycle</text><path class="edge" marker-end="url(#arrow)" d="M220,303 L220,333"/><path class="edge" marker-end="url(#arrow)" d="M675,303 L675,333"/><rect class="box" x="28" y="468" width="395" height="92" rx="10"/><text class="label" x="44" y="496">Data plane</text><text class="body" x="44" y="522">Run, wait, read, write</text><text class="body" x="44" y="544">Return exit / output / handle</text><rect class="box" x="477" y="468" width="395" height="92" rx="10"/><text class="label" x="493" y="496">State persistence</text><text class="body" x="493" y="522">Full vs filesystem-only</text><text class="body" x="493" y="544">External connections differ</text><path class="edge" marker-end="url(#arrow)" d="M220,433 L220,463"/><path class="edge" marker-end="url(#arrow)" d="M675,433 L675,463"/><rect class="box" x="28" y="596" width="844" height="92" rx="10"/><text class="label" x="44" y="624">Explicit cleanup</text><text class="body" x="44" y="650">Claim expiry, sandbox TTL, snapshots and artifacts need distinct policies</text><text class="small" x="28" y="710">SDK compatibility does not imply identical image, state or execution capabilities.</text><text class="small" x="28" y="736">Teaching diagram; roles and contracts, not product benchmark results.</text></svg>