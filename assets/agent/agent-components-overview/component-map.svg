<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" role="img"><title>Agent stack: from task to verified output</title><style>text{font-family:Arial,sans-serif;fill:#244c40}.title{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#65786e}.box{fill:#fff;stroke:#93b29a;stroke-width:1.5}.edge{stroke:#487761;stroke-width:2;fill:none}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#487761"/></marker></defs><rect width="900" height="850" fill="#f4f8ef" rx="14"/><text class="title" x="28" y="42">Agent stack: from task to verified output</text><rect class="box" x="28" y="78" width="844" height="92" rx="10"/><text class="label" x="44" y="106">Task definition</text><text class="body" x="44" y="132">Goal, initial state, capabilities, budget, completion criteria</text><rect class="box" x="28" y="205" width="395" height="92" rx="10"/><text class="label" x="44" y="233">Harness / state machine</text><text class="body" x="44" y="259">Build context, choose next step</text><text class="body" x="44" y="281">Harbor may organize trials</text><rect class="box" x="477" y="205" width="395" height="92" rx="10"/><text class="label" x="493" y="233">Model service</text><text class="body" x="493" y="259">Context -&gt; action / final</text><text class="body" x="493" y="281">The model proposes actions</text><path class="edge" marker-end="url(#arrow)" d="M425,240 L472,240"/><path class="edge" marker-end="url(#arrow)" d="M475,269 L428,269"/><path class="edge" marker-end="url(#arrow)" d="M220,173 L220,201"/><rect class="box" x="28" y="335" width="844" height="92" rx="10"/><text class="label" x="44" y="363">Dispatcher / tool interface</text><text class="body" x="44" y="389">Validate, authorize, route by session; local / HTTP / MCP</text><path class="edge" marker-end="url(#arrow)" d="M225,300 L225,331"/><rect class="box" x="28" y="463" width="395" height="92" rx="10"/><text class="label" x="44" y="491">Code tools + sandbox</text><text class="body" x="44" y="517">Files, commands, processes</text><text class="body" x="44" y="539">E2B / ACS / other runtimes</text><rect class="box" x="477" y="463" width="395" height="92" rx="10"/><text class="label" x="493" y="491">Search + browser tools</text><text class="body" x="493" y="517">Candidates, pages, sessions</text><text class="body" x="493" y="539">Search / scrape / interaction</text><path class="edge" marker-end="url(#arrow)" d="M220,430 L220,459"/><path class="edge" marker-end="url(#arrow)" d="M675,430 L675,459"/><rect class="box" x="28" y="591" width="395" height="92" rx="10"/><text class="label" x="44" y="619">State and evidence</text><text class="body" x="44" y="645">Checkpoint, workspace, sources</text><text class="body" x="44" y="667">Observation returns to harness</text><rect class="box" x="477" y="591" width="395" height="92" rx="10"/><text class="label" x="493" y="619">Verifier + artifacts</text><text class="body" x="493" y="645">Tests / supported claims</text><text class="body" x="493" y="667">Patch / cited answer / verdict</text><path class="edge" marker-end="url(#arrow)" d="M220,558 L220,587"/><path class="edge" marker-end="url(#arrow)" d="M675,558 L675,587"/><rect class="box" x="28" y="719" width="844" height="60" rx="10"/><text class="label" x="44" y="747">Trace / trajectory</text><text class="body" x="44" y="773">Record calls, outputs, time, IDs and errors</text><text class="small" x="28" y="800">Execution environment, model context and completion checks are separate objects.</text><text class="small" x="28" y="826">Teaching diagram; roles and contracts, not product benchmark results.</text></svg>