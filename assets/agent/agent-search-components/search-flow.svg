<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" role="img"><title>Search agent: turn documents into evidence</title><style>text{font-family:Arial,sans-serif;fill:#244c40}.title{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#65786e}.box{fill:#fff;stroke:#93b29a;stroke-width:1.5}.edge{stroke:#487761;stroke-width:2;fill:none}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#487761"/></marker></defs><rect width="900" height="750" fill="#f4f8ef" rx="14"/><text class="title" x="28" y="42">Search agent: turn documents into evidence</text><rect class="box" x="28" y="80" width="395" height="92" rx="10"/><text class="label" x="44" y="108">1. Define claims and conditions</text><text class="body" x="44" y="134">Question, version, date, gaps</text><rect class="box" x="477" y="80" width="395" height="92" rx="10"/><text class="label" x="493" y="108">2. Search candidates</text><text class="body" x="493" y="134">Queries -&gt; URLs and snippets</text><path class="edge" marker-end="url(#arrow)" d="M425,126 L472,126"/><rect class="box" x="477" y="214" width="395" height="92" rx="10"/><text class="label" x="493" y="242">3. Fetch / scrape / browser</text><text class="body" x="493" y="268">Read body or interact with page</text><text class="body" x="493" y="290">Preserve source and final URL</text><path class="edge" marker-end="url(#arrow)" d="M675,176 L675,209"/><rect class="box" x="28" y="214" width="395" height="92" rx="10"/><text class="label" x="44" y="242">4. Parse and deduplicate</text><text class="body" x="44" y="268">Sections, table notes, hashes</text><text class="body" x="44" y="290">Repeated source is not independent</text><path class="edge" marker-end="url(#arrow)" d="M474,261 L428,261"/><rect class="box" x="28" y="348" width="395" height="92" rx="10"/><text class="label" x="44" y="376">5. Evidence ledger</text><text class="body" x="44" y="402">Claim -&gt; passage -&gt; conditions</text><text class="body" x="44" y="424">Support, contradiction, unresolved</text><path class="edge" marker-end="url(#arrow)" d="M220,310 L220,343"/><rect class="box" x="477" y="348" width="395" height="92" rx="10"/><text class="label" x="493" y="376">6. Synthesize answer</text><text class="body" x="493" y="402">Use supported claims</text><text class="body" x="493" y="424">Attach precise citations</text><path class="edge" marker-end="url(#arrow)" d="M425,394 L472,394"/><rect class="box" x="477" y="483" width="395" height="92" rx="10"/><text class="label" x="493" y="511">7. Validate and finish</text><text class="body" x="493" y="537">Support, coverage, date, budget</text><path class="edge" marker-end="url(#arrow)" d="M675,444 L675,478"/><rect class="box" x="28" y="483" width="395" height="92" rx="10"/><text class="label" x="44" y="511">8. Search unresolved gaps</text><text class="body" x="44" y="537">Targeted query, bounded loop</text><text class="body" x="44" y="559">Checkpoint evidence + sessions</text><path class="edge" marker-end="url(#arrow)" d="M474,529 L428,529"/><path class="edge" marker-end="url(#arrow)" d="M28,529 L14,529 L14,190 L460,190 L460,126 L472,126"/><text class="small" x="28" y="700">Retrieval relevance, citation support and answer correctness are separate checks.</text><text class="small" x="28" y="726">Teaching diagram; roles and contracts, not product benchmark results.</text></svg>