<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img"><title>Code agent: edit, observe and verify</title><style>text{font-family:Arial,sans-serif;fill:#244c40}.title{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:13px;fill:#65786e}.box{fill:#fff;stroke:#93b29a;stroke-width:1.5}.edge{stroke:#487761;stroke-width:2;fill:none}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#487761"/></marker></defs><rect width="900" height="700" fill="#f4f8ef" rx="14"/><text class="title" x="28" y="42">Code agent: edit, observe and verify</text><rect class="box" x="28" y="82" width="395" height="92" rx="10"/><text class="label" x="44" y="110">1. Fixed task and workspace</text><text class="body" x="44" y="136">Issue, base commit, dependencies</text><rect class="box" x="477" y="82" width="395" height="92" rx="10"/><text class="label" x="493" y="110">2. Context + model</text><text class="body" x="493" y="136">Read / search / select action</text><path class="edge" marker-end="url(#arrow)" d="M425,127 L472,127"/><rect class="box" x="477" y="216" width="395" height="92" rx="10"/><text class="label" x="493" y="244">3. Apply edit / run command</text><text class="body" x="493" y="270">Dispatcher -&gt; sandbox process</text><text class="body" x="493" y="292">Collect exit and observations</text><path class="edge" marker-end="url(#arrow)" d="M675,179 L675,211"/><rect class="box" x="28" y="216" width="395" height="92" rx="10"/><text class="label" x="44" y="244">4. Check actual state</text><text class="body" x="44" y="270">Diff, tests and diagnostics</text><text class="body" x="44" y="292">Failure feeds next decision</text><path class="edge" marker-end="url(#arrow)" d="M474,260 L428,260"/><path class="edge" marker-end="url(#arrow)" d="M28,260 L14,260 L14,194 L460,194 L460,127 L472,127"/><rect class="box" x="28" y="350" width="844" height="92" rx="10"/><text class="label" x="44" y="378">5. Independent verification</text><text class="body" x="44" y="404">Check intended requirements on actual artifact, not only agent final text</text><path class="edge" marker-end="url(#arrow)" d="M220,310 L220,345"/><rect class="box" x="28" y="480" width="395" height="92" rx="10"/><text class="label" x="44" y="508">6. Deliver and collect</text><text class="body" x="44" y="534">Patch, test evidence, limitations</text><rect class="box" x="477" y="480" width="395" height="92" rx="10"/><text class="label" x="493" y="508">Recovery and stop states</text><text class="body" x="493" y="534">Checkpoint + environment</text><text class="body" x="493" y="556">Success / failure / budget / infra</text><path class="edge" marker-end="url(#arrow)" d="M220,445 L220,475"/><path class="edge" marker-end="url(#arrow)" d="M675,445 L675,475"/><text class="small" x="28" y="650">Model calls, command execution and independent verification have distinct results.</text><text class="small" x="28" y="676">Teaching diagram; roles and contracts, not product benchmark results.</text></svg>