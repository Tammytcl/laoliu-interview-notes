<rect x="587" y="260" width="226" height="80" rx="10" fill="#deeee5" stroke="#527caa"/><text x="700" y="306" text-anchor="middle" font-size="16">Bounded ready queue</text>
<path d="M813 300 H853" stroke="#527caa" stroke-width="2" marker-end="url(#a)"/>
<rect x="863" y="260" width="226" height="80" rx="10" fill="#deeee5" stroke="#527caa"/><text x="976" y="306" text-anchor="middle" font-size="16">Learner update</text>
<path d="M955 170 V213 H148 V260" fill="none" stroke="#527caa" stroke-width="2" marker-end="url(#a)"/><text x="390" y="204" font-size="16">Record actions and observations; keep raw tokens, logprobs and versions</text><path d="M954 340 V365 H1104 V182 H700 V170" fill="none" stroke="#527caa" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="35" y="419" font-size="19">Weight publication: gate new requests, confirm drain, sync, then resume</text><text x="35" y="454" font-size="19">Backpressure bounds active work + scoring + ready results, not only one queue</text><text x="35" y="492" font-size="14" fill="#536c83">Teaching diagram. Shared history must preserve the execution and probability contracts.</text></g></svg>