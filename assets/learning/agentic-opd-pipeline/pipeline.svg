<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title"><title id="title">Agentic OPD execution and training pipeline</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#527caa"/></marker></defs><rect width="1120" height="520" rx="20" fill="#f4f8fc"/><g font-family="Arial,sans-serif" fill="#173854"><text x="35" y="48" font-size="25" font-weight="bold">Agentic OPD: execution, scoring, learning and weight publication</text>
<rect x="35" y="90" width="226" height="80" rx="10" fill="#deebfa" stroke="#527caa"/><text x="148" y="136" text-anchor="middle" font-size="16">Admit task</text>
