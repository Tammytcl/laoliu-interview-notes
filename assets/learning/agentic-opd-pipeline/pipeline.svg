<rect x="587" y="90" width="226" height="80" rx="10" fill="#deebfa" stroke="#527caa"/><text x="700" y="136" text-anchor="middle" font-size="16">Student request</text>
<path d="M813 130 H853" stroke="#527caa" stroke-width="2" marker-end="url(#a)"/>
<rect x="863" y="90" width="226" height="80" rx="10" fill="#deebfa" stroke="#527caa"/><text x="976" y="136" text-anchor="middle" font-size="16">Tool / environment</text>
<rect x="35" y="260" width="226" height="80" rx="10" fill="#deeee5" stroke="#527caa"/><text x="148" y="306" text-anchor="middle" font-size="16">Save actual context</text>
<path d="M261 300 H301" stroke="#527caa" stroke-width="2" marker-end="url(#a)"/>
<rect x="311" y="260" width="226" height="80" rx="10" fill="#deeee5" stroke="#527caa"/><text x="424" y="306" text-anchor="middle" font-size="16">Teacher scoring</text>
