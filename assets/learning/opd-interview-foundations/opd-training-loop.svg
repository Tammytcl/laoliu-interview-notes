<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title desc">
  <title id="title">OPD的学生生成、教师评分与学生更新闭环</title>
  <desc id="desc">学生按当前策略生成轨迹，固定采到的历史。冻结教师和当前学生在对应历史上分别计算条件概率，构造损失，仅更新学生，然后刷新生成策略。图不表示硬件数量或实际耗时。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#526377"/></marker></defs>
  <rect width="640" height="700" fill="#fff"/>
  <g font-family="system-ui, sans-serif" fill="#1b2838" text-anchor="middle">
    <g fill="none" stroke="#526377" stroke-width="2" marker-end="url(#arrow)">
      <path d="M320 90V128"/><path d="M320 200V238"/>
      <path d="M320 310V335H160V358"/><path d="M320 335H480V358"/>
      <path d="M160 460V490H250V518"/><path d="M480 460V490H390V518"/>
      <path d="M500 565H628V165H462"/>
    </g>
    <g stroke="#ccd5df" stroke-width="1.5">
      <rect x="180" y="20" width="280" height="70" rx="8" fill="#f4f7fa"/>
      <rect x="180" y="130" width="280" height="70" rx="8" fill="#e4edf8"/>
      <rect x="180" y="240" width="280" height="70" rx="8" fill="#f4f7fa"/>
      <rect x="20" y="360" width="280" height="100" rx="8" fill="#e7f1ed"/>
      <rect x="340" y="360" width="280" height="100" rx="8" fill="#e4edf8"/>
      <rect x="140" y="520" width="360" height="100" rx="8" fill="#f4f7fa"/>
    </g>
    <text x="320" y="63" font-size="22">采样任务输入 x</text>
    <text x="320" y="174" font-size="22">学生生成轨迹 y</text>
    <text x="320" y="281" font-size="22">固定学生访问的前缀 h</text>
    <text x="160" y="398" font-size="22">冻结教师：计算 q</text>
    <text x="160" y="432" font-size="18">同一前缀上的下一 token 概率</text>
    <text x="480" y="398" font-size="22">当前学生：计算 p</text>
    <text x="480" y="432" font-size="18">保留学生可训练的梯度路径</text>
    <text x="320" y="559" font-size="22">计算 KL 或采样代理损失</text>
    <text x="320" y="593" font-size="22">仅更新学生，刷新生成策略</text>
    <text x="320" y="669" font-size="18" fill="#526377">本文概念示意 · 不表示设备配比或实际耗时</text>
  </g>
</svg>
