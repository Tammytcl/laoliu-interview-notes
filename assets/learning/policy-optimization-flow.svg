<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Policy optimization: offline pairs and online rollouts</title><desc id="desc">DPO uses fixed preference pairs. Online methods change advantage estimation, ratios, surrogate functions, reduction, or sampling. Teaching diagram, not a paper experiment.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#496b56"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#294a37;font-size:18px}.title{font-size:27px;font-weight:700}.small{font-size:15px;fill:#647c60}.label{font-size:15px;font-weight:700}.box{fill:white;stroke:#b6c9b0;stroke-width:2}.arrow{stroke:#496b56;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="630" rx="14" fill="#f4f7f0"/><text x="30" y="45" class="title">Where does each algorithm change the training step?</text><text x="30" y="82" class="small">Teaching diagram: logical data dependencies, not GPU placement or performance measurements.</text><text x="30" y="131" class="label">OFFLINE</text><rect class="box" x="155" y="105" width="230" height="90" rx="10"/><text x="175" y="143">Preference pairs</text><text x="175" y="170" class="small">Fixed preference pairs</text><path class="arrow" d="M388 150H435"/><rect class="box" x="445" y="105" width="235" height="90" rx="10"/><text x="465" y="143">Policy / reference</text><text x="465" y="170" class="small">Four answer logprobs</text><path class="arrow" d="M685 150H730"/><rect class="box" x="740" y="105" width="175" height="90" rx="10"/><text x="760" y="143">DPO pair loss</text><text x="760" y="170" class="small">Relative margin</text><path class="arrow" d="M920 150H965"/><rect class="box" x="975" y="105" width="185" height="90" rx="10"/><text x="995" y="155">Optimizer step</text><path d="M30 225H1170" stroke="#cbd8c4"/><text x="30" y="275" class="label">ONLINE</text><rect class="box" x="30" y="310" width="155" height="85" rx="10"/><text x="49" y="345">Sample + score</text><text x="49" y="372" class="small">Behavior policy</text><path class="arrow" d="M190 352H212"/><rect class="box" x="225" y="310" width="160" height="85" rx="10"/><text x="245" y="345">Advantage</text><text x="245" y="372" class="small">Fixed target</text><path class="arrow" d="M390 352H412"/><rect class="box" x="425" y="310" width="165" height="85" rx="10"/><text x="445" y="345">Policy ratio</text><text x="445" y="372" class="small">From logprob</text><path class="arrow" d="M595 352H617"/><rect class="box" x="630" y="310" width="150" height="85" rx="10"/><text x="650" y="345">Surrogate</text><text x="650" y="372" class="small">Clip / smooth</text><path class="arrow" d="M785 352H807"/><rect class="box" x="820" y="310" width="145" height="85" rx="10"/><text x="840" y="345">Reduction</text><text x="840" y="372" class="small">Mask + weights</text><path class="arrow" d="M970 352H992"/><rect class="box" x="1005" y="310" width="160" height="85" rx="10"/><text x="1023" y="359">Optimizer step</text><text x="30" y="438" class="label">DAPO: filter / refill</text><text x="30" y="466" class="small">+ length reward</text><text x="225" y="438" class="label">PPO: value + GAE</text><text x="225" y="466" class="small">GRPO: group mean / std</text><text x="225" y="494" class="small">GDPO: per reward + batch</text><text x="425" y="438" class="label">GSPO: sequence</text><text x="425" y="466" class="small">Geometric mean</text><text x="630" y="438" class="label">SAPO: smooth f(r)</text><text x="630" y="466" class="small">DAPO: higher upper clip</text><text x="850" y="501" class="label">DAPO: token mean</text><path class="arrow" d="M896 475V403"/><path class="arrow" d="M1085 402V560H105V402"/><text x="365" y="588" class="small">Publish updated weights for the next rollout; reference and behavior have different roles.</text></svg>
