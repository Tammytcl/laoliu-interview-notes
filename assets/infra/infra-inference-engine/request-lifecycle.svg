<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#345f50"/></marker></defs><rect width="1000" height="540" fill="#fafcf8"/><style>text{font-family:Arial,sans-serif;fill:#234438;font-size:23px}.small{font-size:18px}.title{font-size:29px;font-weight:bold}.line{stroke:#345f50;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><text x="35" y="45" class="title">One request: queue → prefill → decode → finish</text><rect x="35" y="110" width="160" height="80" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="50" y="158.0" class="">Queue</text><path d="M198,150 L220,150" class="line"/><rect x="225" y="110" width="180" height="80" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="240" y="158.0" class="">Prefill</text><path d="M408,150 L430,150" class="line"/><rect x="435" y="110" width="140" height="80" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="450" y="158.0" class="">Token 1</text><path d="M578,150 L600,150" class="line"/><rect x="610" y="110" width="140" height="80" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="625" y="158.0" class="">Token 2</text><path d="M753,150 L775,150" class="line"/><rect x="785" y="110" width="170" height="80" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="800" y="158.0" class="">Finish</text><path d="M35,235 L575,235" class="line"/><text x="180" y="275" class="">TTFT: submit to first token</text><path d="M575,310 L750,310" class="line"/><text x="595" y="345" class="">ITL</text><text x="35" y="405" class="">KV stores the known prefix and grows with new tokens.</text><rect x="35" y="440" width="420" height="50" rx="10" fill="#f0d9a0" stroke="#b8cab5"/><text x="50" y="473.0" class="">Prompt KV</text><rect x="465" y="440" width="125" height="50" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="480" y="473.0" class="">+ token 1</text><rect x="600" y="440" width="125" height="50" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="615" y="473.0" class="">+ token 2</text><text x="35" y="525" class="small">KV is released / recycled when the request ends.</text></svg>