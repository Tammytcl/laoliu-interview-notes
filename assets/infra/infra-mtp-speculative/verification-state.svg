<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#416952"/></marker></defs><rect width="1100" height="570" rx="14" fill="#f5f8f0"/><style>text{font-family:Arial,sans-serif;fill:#2d4e3a;font-size:21px}.title{font-size:28px;font-weight:700}.small{font-size:17px;fill:#687d60}.box{fill:white;stroke:#b1c6a7;stroke-width:2}.arrow{stroke:#416952;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="45" class="title">Verification stops at the first rejected draft token</text><rect class="box" x="30" y="100" width="290" height="85" rx="10"/><text x="45" y="135">Draft: A, X, C</text><text x="45" y="165" class="small">Candidates are not committed</text><rect class="box" x="390" y="100" width="330" height="85" rx="10"/><text x="405" y="135">Verify: A matches; X fails</text><text x="405" y="165" class="small">Later candidates use wrong prefix</text><rect class="box" x="785" y="100" width="280" height="85" rx="10"/><text x="800" y="135">Emit: A, B</text><text x="800" y="165" class="small">B is the target correction</text><path class="arrow" d="M325 140L380 140"/><path class="arrow" d="M725 140L775 140"/><rect class="box" x="30" y="300" width="290" height="85" rx="10"/><text x="45" y="335">Keep target KV for A</text><text x="45" y="365" class="small">Prefix + verified accepted token</text><rect class="box" x="390" y="300" width="330" height="85" rx="10"/><text x="405" y="335">Drop KV for X and C</text><text x="405" y="365" class="small">Both target and draft state checked</text><rect class="box" x="785" y="300" width="280" height="85" rx="10"/><text x="800" y="335">B may remain pending</text><text x="800" y="365" class="small">Populate KV next round</text><path class="arrow" d="M180 188L180 290"/><path class="arrow" d="M550 188L550 290"/><path class="arrow" d="M925 188L925 290"/><text x="30" y="474" class="small">Accepted token count, visible output length and populated KV length may differ.</text><text x="30" y="548" class="small">Teaching diagram; not an experiment or measured performance claim.</text></svg>