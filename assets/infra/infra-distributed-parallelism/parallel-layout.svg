<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#345f50"/></marker></defs><rect width="1000" height="540" fill="#fafcf8"/><style>text{font-family:Arial,sans-serif;fill:#234438;font-size:23px}.small{font-size:18px}.title{font-size:29px;font-weight:bold}.line{stroke:#345f50;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><text x="35" y="45" class="title">Parallelism: four different objects to split</text><rect x="35" y="85" width="450" height="205" rx="10" fill="white" stroke="#b8cab5"/><text x="50" y="120" class="">DP: data</text><rect x="515" y="85" width="450" height="205" rx="10" fill="white" stroke="#b8cab5"/><text x="530" y="120" class="">TP: matrices</text><rect x="35" y="300" width="450" height="205" rx="10" fill="white" stroke="#b8cab5"/><text x="50" y="335" class="">PP: layers</text><rect x="515" y="300" width="450" height="205" rx="10" fill="white" stroke="#b8cab5"/><text x="530" y="335" class="">Sharding: stored states</text><rect x="55" y="155" width="180" height="60" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="70" y="193.0" class="">Model copy 0</text><rect x="265" y="155" width="180" height="60" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="280" y="193.0" class="">Model copy 1</text><text x="60" y="250" class="">batch A</text><text x="270" y="250" class="">batch B</text><rect x="535" y="155" width="125" height="65" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="550" y="195.5" class="">W part 0</text><rect x="680" y="155" width="125" height="65" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="695" y="195.5" class="">W part 1</text><text x="535" y="255" class="small">same input batch; combine results</text><rect x="55" y="375" width="175" height="60" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="70" y="413.0" class="">Layers 0–15</text><rect x="275" y="375" width="175" height="60" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="290" y="413.0" class="">Layers 16–31</text><path d="M233,405 L270,405" class="line"/><text x="55" y="470" class="small">microbatches move through stages</text><rect x="535" y="375" width="175" height="60" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="550" y="413.0" class="">State shard 0</text><rect x="750" y="375" width="175" height="60" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="765" y="413.0" class="">State shard 1</text><text x="535" y="470" class="small">gather / reduce-scatter as needed</text><text x="35" y="525" class="small">These mechanisms may be composed; they are not framework names.</text></svg>