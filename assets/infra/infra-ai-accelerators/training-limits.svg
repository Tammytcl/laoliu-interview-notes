<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#345f50"/></marker></defs><rect width="1000" height="600" fill="#fafcf8"/><style>text{font-family:Arial,sans-serif;fill:#234438;font-size:23px}.title{font-size:28px;font-weight:bold}.small{font-size:18px}.box{fill:#e2ecdf;stroke:#b8cab5}.line{stroke:#345f50;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><text x="35" y="45" class="title">One training task, five constraints</text><rect x="345" y="260" width="310" height="85" rx="14" fill="#b0cbb5"/><text x="405" y="312">Same task / quality</text><rect class="box" x="350" y="90" width="300" height="90" rx="12"/><text x="375" y="125">Compute &amp; precision</text><text x="375" y="157" class="small">dense / sparse / dtype</text><rect class="box" x="35" y="225" width="270" height="100" rx="12"/><text x="55" y="265">Memory capacity</text><text x="55" y="298" class="small">states + activations + KV</text><rect class="box" x="695" y="225" width="270" height="100" rx="12"/><text x="715" y="265">HBM bandwidth</text><text x="715" y="298" class="small">bytes moved per second</text><rect class="box" x="120" y="440" width="320" height="95" rx="12"/><text x="145" y="478">Interconnect &amp; topology</text><text x="145" y="513" class="small">within / across nodes</text><rect class="box" x="560" y="440" width="320" height="95" rx="12"/><text x="585" y="478">Software execution path</text><text x="585" y="513" class="small">kernels, compiler, framework</text><path class="line" d="M500 184 V253"/><path class="line" d="M309 275 L338 297"/><path class="line" d="M691 275 L662 297"/><path class="line" d="M280 436 L390 352"/><path class="line" d="M720 436 L610 352"/><text x="35" y="580" class="small">Peak TFLOPS alone does not predict training time or cost.</text></svg>
