<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#416952"/></marker></defs><rect width="1100" height="570" rx="14" fill="#f5f8f0"/><style>text{font-family:Arial,sans-serif;fill:#2d4e3a;font-size:21px}.title{font-size:28px;font-weight:700}.small{font-size:17px;fill:#687d60}.box{fill:white;stroke:#b1c6a7;stroke-width:2}.arrow{stroke:#416952;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><text x="30" y="45" class="title">MTP serving: quality, time and memory budgets</text><rect class="box" x="30" y="110" width="240" height="85" rx="10"/><text x="45" y="145">Draft cost</text><text x="45" y="175" class="small">MTP block + output head</text><rect class="box" x="305" y="110" width="240" height="85" rx="10"/><text x="320" y="145">Verification cost</text><text x="320" y="175" class="small">Target queries</text><rect class="box" x="580" y="110" width="240" height="85" rx="10"/><text x="595" y="145">Other round cost</text><text x="595" y="175" class="small">Schedule / sync / commit</text><rect class="box" x="855" y="110" width="210" height="85" rx="10"/><text x="870" y="145">Round time</text><text x="870" y="175" class="small">All costs included</text><path class="arrow" d="M275 150L295 150"/><path class="arrow" d="M550 150L570 150"/><path class="arrow" d="M825 150L845 150"/><text x="30" y="275">Time per emitted token = mean round time / mean emitted tokens</text><rect class="box" x="30" y="340" width="305" height="85" rx="10"/><text x="45" y="375">Acceptance is not speed</text><text x="45" y="405" class="small">Measure valid prefix length</text><rect class="box" x="395" y="340" width="305" height="85" rx="10"/><text x="410" y="375">Memory is another budget</text><text x="410" y="405" class="small">Weights + KV + temporaries</text><rect class="box" x="760" y="340" width="305" height="85" rx="10"/><text x="775" y="375">Compare equal workloads</text><text x="775" y="405" class="small">TTFT / ITL / throughput / SLO</text><text x="30" y="548" class="small">Teaching diagram; not an experiment or measured performance claim.</text></svg>