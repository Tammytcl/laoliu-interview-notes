<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#345f50"/></marker></defs><rect width="1000" height="540" fill="#fafcf8"/><style>text{font-family:Arial,sans-serif;fill:#234438;font-size:23px}.small{font-size:18px}.title{font-size:29px;font-weight:bold}.line{stroke:#345f50;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><text x="35" y="45" class="title">Online training: data path and weight path</text><rect x="35" y="165" width="175" height="75" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="50" y="210.5" class="">Rollout</text><path d="M215,202 L240,202" class="line"/><rect x="245" y="165" width="200" height="75" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="260" y="210.5" class="">Scoring</text><path d="M450,202 L475,202" class="line"/><rect x="485" y="165" width="205" height="75" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="500" y="210.5" class="">Ready queue</text><path d="M695,202 L720,202" class="line"/><rect x="745" y="165" width="220" height="75" rx="10" fill="#e2ecdf" stroke="#b8cab5"/><text x="760" y="210.5" class="">Learner</text><rect x="35" y="320" width="245" height="70" rx="10" fill="#f0d9a0" stroke="#b8cab5"/><text x="50" y="363.0" class="">Tool / environment</text><path d="M120,244 L120,315" class="line"/><text x="315" y="320" class="small">reward / reference / teacher</text><text x="485" y="285" class="small">bounded, consume once</text><path d="M855,160 V90 H120 V160" class="line"/><text x="405" y="85" class="small">Publish new policy weights</text><path d="M590,300 V460 H20 V202 H30" class="line" stroke-dasharray="8,8"/><text x="325" y="495" class="small">Admission / backpressure</text><text x="35" y="515" class="small">ready ≠ backward ≠ optimizer step ≠ weight publish</text></svg>