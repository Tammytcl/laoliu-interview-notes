<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#345f50"/></marker></defs><rect width="1000" height="540" fill="#fafcf8"/><style>text{font-family:Arial,sans-serif;fill:#234438;font-size:23px}.small{font-size:18px}.title{font-size:29px;font-weight:bold}.line{stroke:#345f50;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><text x="35" y="45" class="title">Roofline: upper bounds, not benchmark data</text><path d="M110,440 L110,85" class="line"/><path d="M110,440 L920,440" class="line"/><text x="130" y="105" class="">Throughput</text><text x="550" y="510" class="">Arithmetic intensity (FLOP / byte)</text><path d="M130,425 L500,155 L900,155" stroke="#317956" stroke-width="6" fill="none"/><path d="M500,155 V440" stroke="#94aa91" stroke-width="2" stroke-dasharray="8,8"/><text x="200" y="255" class="">Bandwidth bound</text><text x="590" y="135" class="">Compute bound</text><text x="560" y="220" class="">ceiling = C</text><text x="155" y="360" class="">ceiling = W × I</text><text x="395" y="478" class="">I* = C / W</text><text x="170" y="75" class="small">Actual kernels run at or below the roof.</text></svg>